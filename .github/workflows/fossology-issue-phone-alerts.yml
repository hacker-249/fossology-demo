name: FOSSology Issue Phone Alerts

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fossology-issue-phone-alerts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Load durable checkpoint
        id: checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git init state-repo
          git -C state-repo config user.name "github-actions[bot]"
          git -C state-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C state-repo remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git -C state-repo ls-remote --exit-code --heads origin monitor-state >/dev/null 2>&1; then
            git -C state-repo fetch --depth=1 origin monitor-state
            git -C state-repo checkout -B monitor-state FETCH_HEAD
            cp state-repo/last_number "$RUNNER_TEMP/last_number"
            echo "initialized=false" >> "$GITHUB_OUTPUT"
            echo "Loaded durable checkpoint: $(cat "$RUNNER_TEMP/last_number")"
          else
            echo "No durable checkpoint exists yet; initializing a baseline."
            curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/fossology/fossology/issues?state=all&sort=created&direction=desc&per_page=100" \
              -o "$RUNNER_TEMP/baseline.json"

            jq '[.[] | select(has("pull_request") | not) | .number] | max // 0' \
              "$RUNNER_TEMP/baseline.json" > state-repo/last_number
            git -C state-repo add last_number
            git -C state-repo commit -m "Initialize FOSSology issue monitor checkpoint"
            git -C state-repo push origin HEAD:monitor-state
            echo "initialized=true" >> "$GITHUB_OUTPUT"
            echo "Baseline saved to monitor-state. Existing issues will not trigger alerts."
          fi

      - name: Find and notify new issues
        if: steps.checkpoint.outputs.initialized == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${NTFY_TOPIC:-}" ]]; then
            echo "::error::Add the NTFY_TOPIC repository secret in Settings > Secrets and variables > Actions."
            exit 1
          fi

          LAST=$(cat "$RUNNER_TEMP/last_number")
          MAX_SEEN="$LAST"
          mkdir -p /tmp/fossology-issues
          : > /tmp/fossology-issues/new.jsonl

          PAGE=1
          while [[ "$PAGE" -le 10 ]]; do
            FILE="/tmp/fossology-issues/page-$PAGE.json"

            curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/fossology/fossology/issues?state=all&sort=created&direction=desc&per_page=100&page=$PAGE" \
              -o "$FILE"

            COUNT=$(jq 'length' "$FILE")
            [[ "$COUNT" -gt 0 ]] || break

            jq -c --argjson last "$LAST" \
              '.[] | select(.number > $last) | select(has("pull_request") | not)' \
              "$FILE" >> /tmp/fossology-issues/new.jsonl

            PAGE_MAX=$(jq '[.[].number] | max // 0' "$FILE")
            if [[ "$PAGE_MAX" -gt "$MAX_SEEN" ]]; then
              MAX_SEEN="$PAGE_MAX"
            fi

            PAGE_MIN=$(jq '[.[].number] | min // 0' "$FILE")
            if [[ "$PAGE_MIN" -le "$LAST" || "$COUNT" -lt 100 ]]; then
              break
            fi

            PAGE=$((PAGE + 1))
          done

          jq -s 'sort_by(.number)[] |
            [.number, (.title | gsub("[\\r\\n\\t]"; " ")),
             .html_url, .user.login, .created_at] | @tsv' \
            /tmp/fossology-issues/new.jsonl > /tmp/fossology-issues/sorted.tsv

          while IFS=$'\t' read -r NUMBER TITLE URL AUTHOR CREATED; do
            [[ -n "${NUMBER:-}" ]] || continue

            curl --fail --silent --show-error --retry 3 \
              -H "Title: New FOSSology issue #$NUMBER" \
              -H "Priority: high" \
              -H "Tags: github,bell" \
              --data-binary "New issue in fossology/fossology

          #$NUMBER: $TITLE
          Author: @$AUTHOR
          Created: $CREATED

          $URL" \
              "https://ntfy.sh/$NTFY_TOPIC"

            echo "Sent notification for issue #$NUMBER"
          done < /tmp/fossology-issues/sorted.tsv

          if [[ "$MAX_SEEN" -gt "$LAST" ]]; then
            echo "$MAX_SEEN" > state-repo/last_number
            git -C state-repo add last_number
            git -C state-repo commit -m "Update FOSSology issue monitor checkpoint"
            git -C state-repo push origin HEAD:monitor-state
            echo "Checkpoint updated to $MAX_SEEN"
          else
            echo "No newer issue numbers found; checkpoint unchanged."
          fi
